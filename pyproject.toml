[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrr"
version = "0.1.0"
description = "Copy-Time Ransomware Recovery"
requires-python = ">=3.11"
dependencies = [
    "inotify_simple>=1.3.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Not needed by the daemon; used by experiments/ and tools/ (simulator, UI, models).
experiments = ["scikit-learn>=1.4", "joblib", "cryptography", "flask"]

[tool.setuptools.packages.find]
where = ["src"]
