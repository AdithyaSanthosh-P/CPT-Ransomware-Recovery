[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrr"
version = "0.1.0"
description = "Copy-Time Ransomware Recovery"
requires-python = ">=3.11"
dependencies = [
    "inotify_simple>=1.3.5",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
